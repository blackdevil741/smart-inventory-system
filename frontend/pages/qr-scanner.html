<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Scanner — Smart Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css?v=v4" />
  <link rel="stylesheet" href="../css/app-shell.css?v=v4" />
  <link rel="stylesheet" href="../css/qr-scanner.css?v=v4" />
</head>
<body>

  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-sidebar__brand">
        <div class="app-sidebar__brand-mark">SI</div>
        <div class="app-sidebar__brand-name">Inventory</div>
      </div>
      <nav>
        <a href="./dashboard.html"><span class="nav-label">Dashboard</span></a>
        <a href="./inventory.html"><span class="nav-label">Inventory</span></a>
        <a href="./qr-scanner.html" class="is-active"><span class="nav-label">QR Scanner</span></a>
        <a href="./analytics.html"><span class="nav-label">Analytics</span></a>
        <a href="./reports.html"><span class="nav-label">Reports</span></a>
        <a href="./ai-assistant.html"><span class="nav-label">AI Assistant</span></a>
      </nav>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <h1 class="app-topbar__title">QR Scanner</h1>
        <div class="app-topbar__user">
          <span id="userEmail">Loading...</span>
          <button class="app-topbar__logout" id="themeToggleBtn">🌙 Dark</button>
          <button class="app-topbar__logout" id="logoutBtn">Log out</button>
        </div>
      </header>

      <main class="app-content">
        <div class="scanner-layout">
          <div class="scanner-card">
            <h2>Scan a product</h2>
            <p class="hint">Point your camera at a product's QR code to instantly look it up.</p>
            <div id="qrReaderViewport"></div>
            <button class="btn-primary scanner-start-btn" id="toggleScannerBtn">Start camera</button>
          </div>

          <div class="scanner-card">
            <div id="scanResultEmpty" class="scan-result-empty">
              <p>Scan result will appear here.</p>
            </div>

            <div id="scanResultError" class="scan-result-error"></div>

            <div id="scanResultProduct" class="scan-result-product">
              <h3 id="resultName"></h3>
              <p class="sku" id="resultSku"></p>
              <p style="color: var(--stone-500); font-size: var(--fs-sm);" id="resultCategory"></p>
              <div class="scan-result-qty" id="resultQty"></div>

              <div class="scan-quick-actions">
                <button class="decrease" data-delta="-10">-10</button>
                <button class="decrease" data-delta="-5">-5</button>
                <button class="decrease" data-delta="-1">-1</button>
                <button class="increase" data-delta="1">+1</button>
                <button class="increase" data-delta="5">+5</button>
                <button class="increase" data-delta="10">+10</button>
              </div>

              <a href="./inventory.html" style="display:block; margin-top: var(--space-6); color: var(--stock-green-600); font-weight: 600; text-decoration: none; font-size: var(--fs-sm);">
                View full inventory →
              </a>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="../js/firebase-init.js?v=v4"></script>
  <script src="../js/components/theme-toggle.js?v=v4"></script>
  <script src="../js/services/api.js?v=v4"></script>
  <script src="../js/services/products-api.js?v=v4"></script>
  <script src="../js/components/toast.js?v=v4"></script>
  <script src="../js/pages/qr-scanner.js?v=v4"></script>
</body>
</html>
