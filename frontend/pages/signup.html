<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Smart Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css?v=v4" />
  <link rel="stylesheet" href="../css/auth.css?v=v4" />
</head>
<body>

  <main class="auth-screen">
    <div class="auth-brand">
      <div class="auth-brand__mark">SI</div>
      <div class="auth-brand__name">Smart<span>Inventory</span></div>
    </div>

    <section class="tag-card">
      <p class="tag-card__eyebrow">New vendor</p>
      <h1 class="tag-card__title">Create your account</h1>
      <p class="tag-card__subtitle">Start tracking your stock in minutes.</p>

      <div class="auth-alert auth-alert--error" id="signupError"></div>

      <form id="signupForm" novalidate>
        <div class="field">
          <label for="shopName">Shop / Vendor name</label>
          <input type="text" id="shopName" name="shopName" placeholder="Sharma General Store" required />
          <div class="field-error" id="shopNameError"></div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@yourshop.com" autocomplete="email" required />
          <div class="field-error" id="emailError"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" required />
          <div class="field-error" id="passwordError"></div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" required />
          <div class="field-error" id="confirmPasswordError"></div>
        </div>

        <button type="submit" class="btn-primary" id="signupSubmit" style="margin-top: var(--space-2);">Create account</button>
      </form>

      <p class="auth-switch">
        Already have an account?
        <a href="./login.html" class="link-muted">Log in</a>
      </p>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-init.js?v=v4"></script>
  <script src="../js/services/api.js?v=v4"></script>
  <script src="../js/pages/signup.js?v=v4"></script>
</body>
</html>
