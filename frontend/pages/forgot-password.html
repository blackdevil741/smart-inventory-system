<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Smart Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css?v=v4" />
  <link rel="stylesheet" href="../css/auth.css?v=v4" />
</head>
<body>

  <main class="auth-screen">
    <div class="auth-brand">
      <div class="auth-brand__mark">SI</div>
      <div class="auth-brand__name">Smart<span>Inventory</span></div>
    </div>

    <section class="tag-card">
      <p class="tag-card__eyebrow">Account recovery</p>
      <h1 class="tag-card__title">Reset your password</h1>
      <p class="tag-card__subtitle">We'll email you a reset link.</p>

      <div class="auth-alert auth-alert--success" id="resetSuccess"></div>
      <div class="auth-alert auth-alert--error" id="resetError"></div>

      <form id="resetForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@yourshop.com" autocomplete="email" required />
          <div class="field-error" id="emailError"></div>
        </div>

        <button type="submit" class="btn-primary" id="resetSubmit">Send reset link</button>
      </form>

      <p class="auth-switch">
        Remembered your password?
        <a href="./login.html" class="link-muted">Back to log in</a>
      </p>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-init.js?v=v4"></script>
  <script src="../js/services/api.js?v=v4"></script>
  <script src="../js/pages/forgot-password.js?v=v4"></script>
</body>
</html>
