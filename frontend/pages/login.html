<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Smart Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css?v=v4" />
  <link rel="stylesheet" href="../css/auth.css?v=v4" />
</head>
<body>

  <main class="auth-screen">
    <div class="auth-brand">
      <div class="auth-brand__mark">SI</div>
      <div class="auth-brand__name">Smart<span>Inventory</span></div>
    </div>

    <section class="tag-card">
      <p class="tag-card__eyebrow">Vendor sign in</p>
      <h1 class="tag-card__title">Welcome back</h1>
      <p class="tag-card__subtitle">Log in to manage your stock.</p>

      <div class="auth-alert auth-alert--error" id="loginError"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@yourshop.com" autocomplete="email" required />
          <div class="field-error" id="emailError"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
          <div class="field-error" id="passwordError"></div>
        </div>

        <div class="field-row-between">
          <label style="display:flex; align-items:center; gap:6px; font-size: var(--fs-sm); color: var(--stone-500);">
            <input type="checkbox" id="rememberMe" style="width:auto;" />
            Remember me
          </label>
          <a href="./forgot-password.html" class="link-muted">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary" id="loginSubmit">Log in</button>
      </form>

      <p class="auth-switch">
        Don't have an account?
        <a href="./signup.html" class="link-muted">Create one</a>
      </p>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-init.js?v=v4"></script>
  <script src="../js/services/api.js?v=v4"></script>
  <script src="../js/pages/login.js?v=v4"></script>
</body>
</html>
