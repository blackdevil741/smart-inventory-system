<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Assistant — Smart Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css?v=v4" />
  <link rel="stylesheet" href="../css/app-shell.css?v=v4" />
  <link rel="stylesheet" href="../css/ai-assistant.css?v=v4" />
</head>
<body>

  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-sidebar__brand">
        <div class="app-sidebar__brand-mark">SI</div>
        <div class="app-sidebar__brand-name">Inventory</div>
      </div>
      <nav>
        <a href="./dashboard.html"><span class="nav-label">Dashboard</span></a>
        <a href="./inventory.html"><span class="nav-label">Inventory</span></a>
        <a href="./qr-scanner.html"><span class="nav-label">QR Scanner</span></a>
        <a href="./analytics.html"><span class="nav-label">Analytics</span></a>
        <a href="./reports.html"><span class="nav-label">Reports</span></a>
        <a href="./ai-assistant.html" class="is-active"><span class="nav-label">AI Assistant</span></a>
      </nav>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <h1 class="app-topbar__title">AI Assistant</h1>
        <div class="app-topbar__user">
          <span id="userEmail">Loading...</span>
          <button class="app-topbar__logout" id="themeToggleBtn">🌙 Dark</button>
          <button class="app-topbar__logout" id="logoutBtn">Log out</button>
        </div>
      </header>

      <main class="app-content">
        <div class="chat-container">
          <div class="chat-messages" id="chatMessages">
            <div class="chat-message assistant">
              Hi! I can answer questions about your inventory using your real, current data. Try one of the suggestions below, or type your own question.
            </div>
          </div>

          <div class="chat-suggestions">
            <button data-question="What products are low?">What products are low?</button>
            <button data-question="Which category has the highest stock?">Highest stock category?</button>
            <button data-question="Suggest reorder items">Suggest reorder items</button>
            <button data-question="What's my stock worth?">What's my stock worth?</button>
          </div>

          <form class="chat-input-row" id="chatForm">
            <input type="text" id="chatInput" placeholder="Ask about your inventory..." autocomplete="off" />
            <button type="submit" id="chatSendBtn">Send</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-init.js?v=v4"></script>
  <script src="../js/components/theme-toggle.js?v=v4"></script>
  <script src="../js/services/api.js?v=v4"></script>
  <script src="../js/services/products-api.js?v=v4"></script>
  <script src="../js/components/toast.js?v=v4"></script>
  <script src="../js/pages/ai-assistant.js?v=v4"></script>
</body>
</html>
