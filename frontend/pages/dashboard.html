<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Smart Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css?v=v4" />
  <link rel="stylesheet" href="../css/app-shell.css?v=v4" />
  <link rel="stylesheet" href="../css/dashboard.css?v=v4" />
</head>
<body>

  <div class="app-shell">
    <aside class="app-sidebar">
      <div class="app-sidebar__brand">
        <div class="app-sidebar__brand-mark">SI</div>
        <div class="app-sidebar__brand-name">Inventory</div>
      </div>
      <nav>
        <a href="./dashboard.html" class="is-active"><span class="nav-label">Dashboard</span></a>
        <a href="./inventory.html"><span class="nav-label">Inventory</span></a>
        <a href="./qr-scanner.html"><span class="nav-label">QR Scanner</span></a>
        <a href="./analytics.html"><span class="nav-label">Analytics</span></a>
        <a href="./reports.html"><span class="nav-label">Reports</span></a>
        <a href="./ai-assistant.html"><span class="nav-label">AI Assistant</span></a>
      </nav>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <h1 class="app-topbar__title">Dashboard</h1>
        <div class="app-topbar__user">
          <span id="userEmail">Loading...</span>
          <button class="app-topbar__logout" id="themeToggleBtn">🌙 Dark</button>
          <button class="app-topbar__logout" id="logoutBtn">Log out</button>
        </div>
      </header>

      <main class="app-content">
        <div class="summary-grid" id="summaryGrid">
          <div class="summary-card">
            <div class="summary-card__label">Total Products</div>
            <div class="summary-card__value" id="cardTotalProducts">—</div>
          </div>
          <div class="summary-card card--low">
            <div class="summary-card__label">Low Stock</div>
            <div class="summary-card__value" id="cardLowStock">—</div>
          </div>
          <div class="summary-card card--out">
            <div class="summary-card__label">Out of Stock</div>
            <div class="summary-card__value" id="cardOutOfStock">—</div>
          </div>
          <div class="summary-card card--categories">
            <div class="summary-card__label">Categories</div>
            <div class="summary-card__value" id="cardCategories">—</div>
          </div>
          <div class="summary-card card--value">
            <div class="summary-card__label">Stock Value (cost)</div>
            <div class="summary-card__value" id="cardStockValue">—</div>
          </div>
        </div>

        <div class="dashboard-columns">
          <div class="dashboard-panel">
            <h2>Needs attention</h2>
            <ul class="low-stock-list" id="lowStockList">
              <li class="dashboard-empty">Loading...</li>
            </ul>
          </div>

          <div class="dashboard-panel">
            <h2>Recent activity</h2>
            <ul class="activity-list" id="activityList">
              <li class="dashboard-empty">Loading...</li>
            </ul>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-init.js?v=v4"></script>
  <script src="../js/components/theme-toggle.js?v=v4"></script>
  <script src="../js/services/api.js?v=v4"></script>
  <script src="../js/services/products-api.js?v=v4"></script>
  <script src="../js/components/toast.js?v=v4"></script>
  <script src="../js/pages/dashboard.js?v=v4"></script>
</body>
</html>
